<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brandDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.75"/>
      <stop offset="0.6" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.9" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#0a0a12"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glowC)"/>

  <!-- Editor de código -->
  <g>
    <rect x="100" y="230" width="430" height="540" rx="24" fill="#12121c"/>
    <rect x="100.5" y="230.5" width="429" height="539" rx="23.5" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
    <circle cx="136" cy="266" r="7" fill="#ff5f57"/>
    <circle cx="160" cy="266" r="7" fill="#febc2e"/>
    <circle cx="184" cy="266" r="7" fill="#28c840"/>
    <text x="494" y="271" fill="#63637a" font-size="14" text-anchor="end" font-family="'JetBrains Mono', Consolas, monospace">um código só</text>
    <g font-family="'JetBrains Mono', Consolas, monospace" font-size="17">
      <text x="136" y="330" fill="#c4b5fd">modulo</text><text x="210" y="330" fill="#ececf3">.json</text>
      <text x="136" y="372" fill="#63637a">{</text>
      <text x="160" y="410" fill="#67e8f9">"rotas"</text><text x="244" y="410" fill="#ececf3">: [...],</text>
      <text x="160" y="448" fill="#67e8f9">"tabelas"</text><text x="264" y="448" fill="#ececf3">: [...],</text>
      <text x="160" y="486" fill="#67e8f9">"pwa"</text><text x="222" y="486" fill="#ececf3">: true,</text>
      <text x="160" y="524" fill="#67e8f9">"notificacoes"</text><text x="314" y="524" fill="#ececf3">: [</text>
      <text x="184" y="562" fill="#a5f3fc">"push"</text><text x="250" y="562" fill="#ececf3">, </text><text x="270" y="562" fill="#a5f3fc">"email"</text>
      <text x="160" y="600" fill="#ececf3">]</text>
      <text x="136" y="638" fill="#63637a">}</text>
    </g>
    <rect x="136" y="680" width="358" height="52" rx="14" fill="url(#brand)"/>
    <text x="315" y="713" fill="#07070c" font-size="18" font-weight="700" text-anchor="middle">Publicar em todas as telas</text>
  </g>

  <!-- Conectores -->
  <g fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 12">
    <path d="M530 500 L 640 500"/>
    <path d="M960 500 C 1020 500, 1020 300, 1090 300"/>
    <path d="M960 500 L 1090 560"/>
    <path d="M960 500 C 1020 500, 1020 790, 1090 790"/>
  </g>

  <!-- Núcleo com módulos -->
  <g>
    <circle cx="800" cy="500" r="200" fill="url(#core)"/>
    <circle cx="800" cy="500" r="170" fill="none" stroke="url(#brand)" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="4 10"/>
    <circle cx="800" cy="500" r="96" fill="#12121c" stroke="url(#brand)" stroke-width="2"/>
    <text x="800" y="494" fill="#ececf3" font-size="26" font-weight="700" text-anchor="middle">Nown</text>
    <text x="800" y="524" fill="#9b9bb2" font-size="15" text-anchor="middle">plataforma</text>
    <g font-size="15">
      <rect x="712" y="290" width="176" height="40" rx="20" fill="#12121c" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <text x="800" y="316" fill="#c4b5fd" text-anchor="middle">Pagamentos</text>
      <rect x="590" y="430" width="140" height="40" rx="20" fill="#12121c" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="660" y="456" fill="#a5f3fc" text-anchor="middle">Chat</text>
      <rect x="870" y="430" width="140" height="40" rx="20" fill="#12121c" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="940" y="456" fill="#a5f3fc" text-anchor="middle">IA</text>
      <rect x="590" y="540" width="140" height="40" rx="20" fill="#12121c" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <text x="660" y="566" fill="#c4b5fd" text-anchor="middle">Planos</text>
      <rect x="870" y="540" width="140" height="40" rx="20" fill="#12121c" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <text x="940" y="566" fill="#c4b5fd" text-anchor="middle">Chamadas</text>
      <rect x="712" y="672" width="176" height="40" rx="20" fill="#12121c" stroke="#22d3ee" stroke-opacity="0.6"/>
      <text x="800" y="698" fill="#a5f3fc" text-anchor="middle">Notificações</text>
    </g>
  </g>

  <!-- Dispositivos -->
  <g>
    <rect x="1090" y="220" width="400" height="170" rx="20" fill="#12121c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="1120" y="262" fill="#ececf3" font-size="19" font-weight="600">Web</text>
    <rect x="1120" y="282" width="340" height="12" rx="6" fill="url(#brand)" opacity="0.8"/>
    <rect x="1120" y="306" width="250" height="10" rx="5" fill="#9b9bb2" opacity="0.4"/>
    <rect x="1120" y="326" width="290" height="10" rx="5" fill="#9b9bb2" opacity="0.3"/>
    <rect x="1120" y="346" width="200" height="10" rx="5" fill="#9b9bb2" opacity="0.25"/>

    <rect x="1090" y="425" width="190" height="270" rx="28" fill="#12121c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="1185" y="470" fill="#ececf3" font-size="18" font-weight="600" text-anchor="middle">iPhone</text>
    <rect x="1115" y="490" width="140" height="80" rx="14" fill="url(#brandDiag)" opacity="0.7"/>
    <rect x="1115" y="584" width="110" height="10" rx="5" fill="#9b9bb2" opacity="0.4"/>
    <rect x="1115" y="604" width="130" height="10" rx="5" fill="#9b9bb2" opacity="0.3"/>
    <rect x="1150" y="660" width="70" height="6" rx="3" fill="#ffffff" opacity="0.25"/>

    <rect x="1300" y="425" width="190" height="270" rx="28" fill="#12121c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="1395" y="470" fill="#ececf3" font-size="18" font-weight="600" text-anchor="middle">Android</text>
    <rect x="1325" y="490" width="140" height="80" rx="14" fill="url(#brandDiag)" opacity="0.45"/>
    <rect x="1325" y="584" width="120" height="10" rx="5" fill="#9b9bb2" opacity="0.4"/>
    <rect x="1325" y="604" width="90" height="10" rx="5" fill="#9b9bb2" opacity="0.3"/>
    <rect x="1360" y="660" width="70" height="6" rx="3" fill="#ffffff" opacity="0.25"/>

    <rect x="1090" y="730" width="400" height="120" rx="20" fill="#12121c" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="1120" y="772" fill="#ececf3" font-size="19" font-weight="600">Desktop · PWA</text>
    <text x="1120" y="806" fill="#9b9bb2" font-size="15">Instalável, rápido e com cache inteligente</text>
  </g>
</svg>
