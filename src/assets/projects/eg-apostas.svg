<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="barV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="barC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.1" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#0a0a12"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glowV)"/>

  <!-- Barra lateral -->
  <rect x="80" y="90" width="230" height="820" rx="24" fill="#12121c" stroke="#ffffff" stroke-opacity="0.08"/>
  <rect x="110" y="126" width="44" height="44" rx="12" fill="url(#brand)"/>
  <text x="168" y="155" fill="#ececf3" font-size="19" font-weight="700">Central</text>
  <g font-size="16">
    <rect x="104" y="214" width="182" height="44" rx="12" fill="#8b5cf6" fill-opacity="0.16"/>
    <text x="126" y="242" fill="#c4b5fd">Painel</text>
    <text x="126" y="300" fill="#9b9bb2">Operações</text>
    <text x="126" y="352" fill="#9b9bb2">Contas e saldos</text>
    <text x="126" y="404" fill="#9b9bb2">Despesas</text>
    <text x="126" y="456" fill="#9b9bb2">Comissões</text>
    <text x="126" y="508" fill="#9b9bb2">Risco</text>
    <text x="126" y="560" fill="#9b9bb2">Metas</text>
    <text x="126" y="612" fill="#9b9bb2">Aprovações</text>
  </g>

  <!-- KPIs -->
  <g>
    <rect x="350" y="90" width="270" height="150" rx="22" fill="#12121c"/>
    <rect x="350.5" y="90.5" width="269" height="149" rx="21.5" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
    <text x="380" y="134" fill="#9b9bb2" font-size="16">Rendimento</text>
    <text x="380" y="184" fill="#ececf3" font-size="40" font-weight="700">+12,4%</text>
    <text x="380" y="216" fill="#34d399" font-size="15">▲ no mês</text>

    <rect x="645" y="90" width="270" height="150" rx="22" fill="#12121c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="675" y="134" fill="#9b9bb2" font-size="16">Exposição</text>
    <text x="675" y="184" fill="#ececf3" font-size="40" font-weight="700">18%</text>
    <rect x="675" y="204" width="210" height="8" rx="4" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="675" y="204" width="80" height="8" rx="4" fill="url(#brand)"/>

    <rect x="940" y="90" width="270" height="150" rx="22" fill="#12121c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="970" y="134" fill="#9b9bb2" font-size="16">Drawdown máx.</text>
    <text x="970" y="184" fill="#ececf3" font-size="40" font-weight="700">−4,1%</text>
    <text x="970" y="216" fill="#9b9bb2" font-size="15">dentro do limite</text>

    <rect x="1235" y="90" width="285" height="150" rx="22" fill="#12121c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="1265" y="134" fill="#9b9bb2" font-size="16">Concentração</text>
    <circle cx="1460" cy="166" r="38" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="10"/>
    <circle cx="1460" cy="166" r="38" fill="none" stroke="url(#brand)" stroke-width="10" stroke-dasharray="150 240" transform="rotate(-90 1460 166)" stroke-linecap="round"/>
    <text x="1265" y="184" fill="#ececf3" font-size="40" font-weight="700">62%</text>
  </g>

  <!-- Gráfico de linha -->
  <g>
    <rect x="350" y="270" width="760" height="380" rx="22" fill="#12121c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="384" y="316" fill="#ececf3" font-size="20" font-weight="600">Desempenho acumulado</text>
    <text x="1076" y="316" fill="#9b9bb2" font-size="15" text-anchor="end">últimos 90 dias</text>
    <g stroke="#ffffff" stroke-opacity="0.05">
      <line x1="384" y1="400" x2="1076" y2="400"/>
      <line x1="384" y1="480" x2="1076" y2="480"/>
      <line x1="384" y1="560" x2="1076" y2="560"/>
    </g>
    <path d="M384 610 L440 590 L500 600 L560 560 L620 572 L680 520 L740 530 L800 488 L860 500 L920 450 L980 462 L1040 410 L1076 400 L1076 620 L384 620 Z" fill="url(#area)"/>
    <path d="M384 610 L440 590 L500 600 L560 560 L620 572 L680 520 L740 530 L800 488 L860 500 L920 450 L980 462 L1040 410 L1076 400" fill="none" stroke="url(#brand)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="1076" cy="400" r="8" fill="#22d3ee"/>
  </g>

  <!-- Barras por operador -->
  <g>
    <rect x="1135" y="270" width="385" height="380" rx="22" fill="#12121c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="1167" y="316" fill="#ececf3" font-size="20" font-weight="600">Por operador</text>
    <rect x="1175" y="440" width="44" height="170" rx="10" fill="url(#barV)"/>
    <rect x="1243" y="390" width="44" height="220" rx="10" fill="url(#barC)"/>
    <rect x="1311" y="480" width="44" height="130" rx="10" fill="url(#barV)"/>
    <rect x="1379" y="420" width="44" height="190" rx="10" fill="url(#barC)"/>
    <rect x="1447" y="510" width="44" height="100" rx="10" fill="url(#barV)"/>
  </g>

  <!-- Alertas e metas -->
  <g>
    <rect x="350" y="680" width="580" height="230" rx="22" fill="#12121c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="384" y="726" fill="#ececf3" font-size="20" font-weight="600">Alertas de risco</text>
    <circle cx="396" cy="776" r="7" fill="#fbbf24"/>
    <text x="418" y="782" fill="#c9c9d6" font-size="16">Exposição acima da meta em uma casa</text>
    <circle cx="396" cy="826" r="7" fill="#34d399"/>
    <text x="418" y="832" fill="#c9c9d6" font-size="16">Despesas recorrentes lançadas</text>
    <circle cx="396" cy="876" r="7" fill="#22d3ee"/>
    <text x="418" y="882" fill="#c9c9d6" font-size="16">2 operações aguardando aprovação</text>

    <rect x="955" y="680" width="565" height="230" rx="22" fill="#12121c" stroke="#ffffff" stroke-opacity="0.08"/>
    <text x="989" y="726" fill="#ececf3" font-size="20" font-weight="600">Metas do trimestre</text>
    <text x="989" y="778" fill="#9b9bb2" font-size="15">Rendimento</text>
    <rect x="989" y="790" width="497" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="989" y="790" width="370" height="10" rx="5" fill="url(#brand)"/>
    <text x="989" y="850" fill="#9b9bb2" font-size="15">Volume operado</text>
    <rect x="989" y="862" width="497" height="10" rx="5" fill="#ffffff" fill-opacity="0.08"/>
    <rect x="989" y="862" width="260" height="10" rx="5" fill="url(#brand)"/>
  </g>
</svg>
