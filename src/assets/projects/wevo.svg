<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" font-family="Inter, 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="brandDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0.7"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.15" cy="0.1" r="0.6">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.9" cy="0.95" r="0.55">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="#0a0a12"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glowV)"/>
  <rect width="1600" height="1000" fill="url(#glowC)"/>

  <!-- Conectores -->
  <g fill="none" stroke="url(#brand)" stroke-width="3" stroke-linecap="round">
    <path d="M580 700 C 640 700, 640 500, 700 500" stroke-dasharray="2 12"/>
    <path d="M960 470 C 1020 470, 1020 275, 1080 275"/>
    <path d="M960 500 L 1080 500"/>
    <path d="M960 530 C 1020 530, 1020 725, 1080 725"/>
  </g>
  <g fill="#22d3ee">
    <circle cx="1080" cy="275" r="6"/>
    <circle cx="1080" cy="500" r="6"/>
    <circle cx="1080" cy="725" r="6"/>
    <circle cx="700" cy="500" r="6" fill="#8b5cf6"/>
  </g>

  <!-- Checkout -->
  <g>
    <rect x="110" y="200" width="470" height="600" rx="28" fill="#12121c"/>
    <rect x="110.5" y="200.5" width="469" height="599" rx="27.5" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
    <text x="150" y="258" fill="#ececf3" font-size="26" font-weight="600">Checkout</text>
    <text x="150" y="288" fill="#9b9bb2" font-size="16">2 itens no carrinho</text>

    <rect x="150" y="320" width="76" height="76" rx="16" fill="url(#brandDiag)" opacity="0.85"/>
    <rect x="246" y="334" width="190" height="14" rx="7" fill="#ececf3" opacity="0.85"/>
    <rect x="246" y="362" width="120" height="12" rx="6" fill="#9b9bb2" opacity="0.5"/>
    <text x="540" y="372" fill="#ececf3" font-size="18" text-anchor="end">R$ 159,90</text>

    <rect x="150" y="420" width="76" height="76" rx="16" fill="#1d1d2b"/>
    <rect x="166" y="436" width="44" height="44" rx="10" fill="url(#brandDiag)" opacity="0.45"/>
    <rect x="246" y="434" width="160" height="14" rx="7" fill="#ececf3" opacity="0.85"/>
    <rect x="246" y="462" width="96" height="12" rx="6" fill="#9b9bb2" opacity="0.5"/>
    <text x="540" y="472" fill="#ececf3" font-size="18" text-anchor="end">R$ 90,00</text>

    <line x1="150" y1="530" x2="540" y2="530" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>
    <text x="150" y="572" fill="#9b9bb2" font-size="18">Total</text>
    <text x="540" y="574" fill="#ececf3" font-size="30" font-weight="700" text-anchor="end">R$ 249,90</text>

    <g font-size="15" fill="#c4b5fd">
      <rect x="150" y="604" width="104" height="40" rx="20" fill="#8b5cf6" fill-opacity="0.16" stroke="#8b5cf6" stroke-opacity="0.6"/>
      <text x="202" y="629" text-anchor="middle">Cartão</text>
      <rect x="266" y="604" width="80" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="306" y="629" text-anchor="middle" fill="#9b9bb2">Pix</text>
      <rect x="358" y="604" width="104" height="40" rx="20" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
      <text x="410" y="629" text-anchor="middle" fill="#9b9bb2">Boleto</text>
    </g>

    <rect x="150" y="672" width="390" height="60" rx="16" fill="url(#brand)"/>
    <text x="345" y="709" fill="#07070c" font-size="20" font-weight="700" text-anchor="middle">Finalizar compra</text>
    <text x="345" y="770" fill="#63637a" font-size="14" text-anchor="middle">Pagamento processado com segurança</text>
  </g>

  <!-- API -->
  <g>
    <rect x="700" y="400" width="260" height="200" rx="26" fill="#12121c"/>
    <rect x="700.5" y="400.5" width="259" height="199" rx="25.5" fill="none" stroke="url(#stroke)" stroke-width="1.5"/>
    <text x="830" y="468" fill="url(#brand)" font-size="40" font-weight="700" text-anchor="middle" font-family="'JetBrains Mono', Consolas, monospace">{ }</text>
    <text x="830" y="518" fill="#ececf3" font-size="21" font-weight="600" text-anchor="middle">API de pagamentos</text>
    <text x="830" y="548" fill="#9b9bb2" font-size="15" text-anchor="middle">REST · integração</text>
  </g>

  <!-- Gateway -->
  <g>
    <rect x="1080" y="200" width="410" height="150" rx="24" fill="#12121c"/>
    <rect x="1080.5" y="200.5" width="409" height="149" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <rect x="1112" y="236" width="78" height="78" rx="20" fill="#8b5cf6" fill-opacity="0.16"/>
    <rect x="1135" y="270" width="32" height="26" rx="6" fill="none" stroke="#a78bfa" stroke-width="3.5"/>
    <path d="M1141 270 v-8 a10 10 0 0 1 20 0 v8" fill="none" stroke="#a78bfa" stroke-width="3.5"/>
    <text x="1214" y="266" fill="#ececf3" font-size="21" font-weight="600">Gateway de pagamento</text>
    <text x="1214" y="296" fill="#9b9bb2" font-size="16">Transação autorizada</text>
  </g>

  <!-- Fila de eventos -->
  <g>
    <rect x="1080" y="425" width="410" height="150" rx="24" fill="#12121c"/>
    <rect x="1080.5" y="425.5" width="409" height="149" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5"/>
    <text x="1112" y="474" fill="#ececf3" font-size="21" font-weight="600">Fila de eventos</text>
    <text x="1458" y="474" fill="#9b9bb2" font-size="15" text-anchor="end">mensageria</text>
    <g>
      <rect x="1112" y="500" width="62" height="42" rx="10" fill="url(#brandDiag)" opacity="1"/>
      <rect x="1184" y="500" width="62" height="42" rx="10" fill="url(#brandDiag)" opacity="0.75"/>
      <rect x="1256" y="500" width="62" height="42" rx="10" fill="url(#brandDiag)" opacity="0.5"/>
      <rect x="1328" y="500" width="62" height="42" rx="10" fill="url(#brandDiag)" opacity="0.3"/>
      <rect x="1400" y="500" width="58" height="42" rx="10" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-dasharray="5 6"/>
    </g>
  </g>

  <!-- Pedido aprovado -->
  <g>
    <rect x="1080" y="650" width="410" height="150" rx="24" fill="#12121c"/>
    <rect x="1080.5" y="650.5" width="409" height="149" rx="23.5" fill="none" stroke="#34d399" stroke-opacity="0.35" stroke-width="1.5"/>
    <circle cx="1151" cy="725" r="39" fill="#34d399" fill-opacity="0.14"/>
    <path d="M1134 726 l11 11 l23 -24" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1214" y="716" fill="#ececf3" font-size="21" font-weight="600">Pedido aprovado</text>
    <text x="1214" y="746" fill="#9b9bb2" font-size="16">Status atualizado via webhook</text>
  </g>
</svg>
