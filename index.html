<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Victor Soares · Engenheiro de Software</title>
    <meta
      name="description"
      content="Victor dos Santos Soares — Engenheiro de Software com foco em IA aplicada e desenvolvimento full stack. Projetos, experiência, skills e contato."
    />
    <meta name="theme-color" content="#07070c" />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Victor Soares · Engenheiro de Software" />
    <meta
      property="og:description"
      content="Engenheiro de Software · IA Aplicada · Full Stack. Projetos, experiência e contato em um só lugar."
    />
  </head>
  <body>
    <div id="root"></div>

    <!-- Formulário estático para o Netlify Forms detectar no deploy -->
    <form name="contato" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <input type="email" name="email" />
      <textarea name="mensagem"></textarea>
      <input name="bot-field" />
    </form>

    <!-- Aviso por e-mail de recado novo no mural (o recado em si fica no Netlify Blobs) -->
    <form name="recado" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="nome" />
      <textarea name="mensagem"></textarea>
      <input name="bot-field" />
    </form>

    <noscript>Ative o JavaScript para ver o portfólio de Victor dos Santos Soares.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
